<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAccess Sign Up Page</title>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./styles/sign-up.css">



</head>

<body>
  <div class="sign-up-page">
    <div class="welcome-paragraph">
      <div class="logo-container">
        <img src="images/eduaccess-logo.webp" alt="EduAccess Logo">
      </div>
      <div class="welcome-paragraph-text-content">
        <h4 class="d-flex ms-auto">Get Started With EduAccess</h4>
        <p></p>
      </div>

    </div>
    <div class="form-container">
      <div class="sign-up-image">
        <img src="images/login-image.webp" alt="Login-image">
      </div>
      <div class="form-box">
        <form action="#" id="signUpForm">
          <div class="full-name">
            <label for="fullName">Fullname</label>
            <input type="text" name="fullName" id="fullName" required aria-required="true" autocomplete="on">
            <br><br>
          </div>
          <div class="email">
            <label for="signUpEmail">Email</label>
            <input type="email" name="email" id="signUpEmail" required aria-required="true" autocomplete="on">
            <br><br>
          </div>
          <div class="passWord">
            <label for="signUpPassword">Password</label>
            <div class="pass-input-icon">
              <input type="password" name="password" id="signUpPassword" class="password-field" autocompletew="on"
                required aria-required="true" minlength="6" maxlength="12">
              <span class="toggle-password show" id="showPassword">
                <i class="bi bi-eye"></i>
              </span>
              <span class="toggle-password hide" id="hidePassword">
                <i class="bi bi-eye-slash"></i>
              </span>

              <br>
            </div>

          </div>
          <button class="submit-btn" id="signUpBtn" type="button">Get Started Now</button>
          <div class="inline-element">
            <hr class="inline-hr">
            <span class="hr-inbetween">Or</span>
            <hr class="inline-hr">
          </div>

        </form>
        <div class="external-login">
          <button href="" class="google-apple" type="button" id="googleBtn">
            <img src="/images/google-logo.webp" alt="Google Logo" class="goggle-logo" id="googleLoginBtn">
            <span>Sign in with google</span>
          </button>
          <a href="" class="google-apple">
            <img src="/images/apple-logo.webp" alt="Apple Logo" class="apple-logo">
            <span>Sign in with apple</span>
          </a>
          <span class="log-in-direct">Already have an account?? <a href="log-in.html">Log in here</a></span>
        </div>
      </div>
    </div>


  </div>

  <script type="module" src="./javascript/auth.js"></script>
</body>

</html>
